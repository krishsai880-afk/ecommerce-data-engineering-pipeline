version: 2

models:
  - name: dim_customers
    description: Customer-level analytics dimension containing order activity and lifecycle metrics.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null
      - name: city
        tests:
          - not_null
      - name: country
        tests:
          - not_null

  - name: fact_orders
    description: Order-level analytics fact table derived from the standardized orders source.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
